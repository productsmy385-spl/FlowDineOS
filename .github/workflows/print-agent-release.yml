# Print agent release. Push a tag `print-agent-v<version>` matching print-agent/package.json.
# Publishes FlowDineOS-Print-Agent-Setup.exe (self-contained Windows installer) and flowdineos-print-agent-linux.tar.gz.
name: Print agent release

on:
  push:
    tags: ["print-agent-v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm }
      - run: npm ci
      - run: npm run agent:build
      - name: Install NSIS 3
        run: choco install nsis --no-progress -y
      - name: Build executable, service host and installer
        run: npm run agent:build:windows
        env:
          MAKENSIS: C:\Program Files (x86)\NSIS\makensis.exe
      - name: Upload Windows setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            print-agent/dist/windows/FlowDineOS-Print-Agent-Setup.exe
            print-agent/dist/windows/SHA256SUMS

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm }
      - run: npm ci
      - name: Tag matches the agent version
        run: |
          VERSION="$(node -p "require('./print-agent/package.json').version")"
          test "${GITHUB_REF_NAME}" = "print-agent-v${VERSION}"
      - run: npx vitest run tests/unit/print-agent tests/static/print-agent.test.ts
      - run: npm run agent:build
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: |
            print-agent/dist/flowdineos-print-agent-linux.tar.gz
            print-agent/dist/SHA256SUMS

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist-release/
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-package
          path: dist-release/
      - name: Calculate release checksums
        working-directory: dist-release
        run: |
          sha256sum FlowDineOS-Print-Agent-Setup.exe flowdineos-print-agent-linux.tar.gz > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist-release/FlowDineOS-Print-Agent-Setup.exe \
            dist-release/flowdineos-print-agent-linux.tar.gz \
            dist-release/SHA256SUMS \
            --title "FlowDineOS Print Agent ${GITHUB_REF_NAME#print-agent-v}" \
            --notes "Self-contained Windows installer (FlowDineOS-Print-Agent-Setup.exe) and Linux systemd package. Guide: knowledge/operations/print-agent.md"
