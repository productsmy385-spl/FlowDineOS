# Continuous integration (S1-P01-T006). Every pull request and push to main is gated by these jobs.
# Required repository secrets (Clerk *development* instance only):
#   CLERK_SECRET_KEY, NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
# Branch protection on main should require: lint, typecheck, unit, static, integration, e2e, build, audit.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:unit

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:static

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Major version to be aligned with Railway in S1-P02-T001.
        image: postgres:16
        env:
          POSTGRES_USER: rasoios
          POSTGRES_PASSWORD: rasoios
          POSTGRES_DB: rasoios_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rasoios" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://rasoios:rasoios@localhost:5432/rasoios_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - name: Apply migrations to an empty database
        run: npx prisma migrate deploy
      # S1-P02-T009: the migrated database must match prisma/schema.prisma exactly.
      - name: Migration drift check
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Seed smoke test (runs twice to prove idempotency)
        run: npm run db:seed && npm run db:seed
      # The suite builds its own run-scoped databases from the migrations (tests/integration/setup).
      - run: npm run test:integration

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rasoios
          POSTGRES_PASSWORD: rasoios
          POSTGRES_DB: rasoios_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rasoios" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CI: "true"
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      DATABASE_URL: postgresql://rasoios:rasoios@localhost:5432/rasoios_e2e?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npx prisma generate
      # The app under test needs a migrated, seeded database (public site specs use the seeded tenants).
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=desktop-chromium --project=tablet --project=mobile
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://rasoios:rasoios@localhost:5432/rasoios_build?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      # Security brief 2026-10-07: no server-only value (compared by name, never printed) and no credential pattern in the
      # browser bundle.
      - run: npm run security:bundle

  # S1-P17-T002: the local print agent builds into one runnable file, on both target OSes (Q-010).
  print-agent:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npm run agent:build
      - run: node print-agent/dist/rasoios-print-agent.cjs version
      - run: npx vitest run tests/unit/print-agent tests/static/print-agent.test.ts

  # Self-contained Windows print agent (print-agent-windows.md): builds the SEA executable, the service host and the NSIS
  # installer, then really installs, upgrades and uninstalls it on this runner and checks the outcome. Nothing is faked:
  # the service is registered with the Service Control Manager and its state is read back.
  print-agent-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npm run agent:build
      - name: Install NSIS 3 (not preinstalled on windows-latest)
        run: choco install nsis --no-progress -y
      - name: Build executable, service host and installer
        run: npm run agent:build:windows
        env:
          MAKENSIS: C:\Program Files (x86)\NSIS\makensis.exe
      - name: The executable runs with no Node.js on PATH
        shell: pwsh
        run: |
          $exe = "print-agent\dist\windows\FlowDineOS.PrintAgent.exe"
          $env:PATH = "$env:SystemRoot\System32"
          if (Get-Command node -ErrorAction SilentlyContinue) { throw "node is still on PATH" }
          $version = & $exe version
          if ($LASTEXITCODE -ne 0 -or $version -ne (Get-Content print-agent\package.json | ConvertFrom-Json).version) { throw "version check failed: $version" }
          & $exe status; if ($LASTEXITCODE -ne 2) { throw "an unpaired agent must exit 2 (needs pairing), got $LASTEXITCODE" }
          "FlowDineOS.PrintAgent.exe $version OK without Node.js"
      - name: Install over an older RasoiOS pairing, upgrade, uninstall (keep data), purge
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = Resolve-Path "print-agent\dist\windows\FlowDineOS-Print-Agent-Setup.exe"
          $install = "C:\Program Files\FlowDineOS Print Agent"
          $data = "C:\ProgramData\FlowDineOS\PrintAgent"
          $legacy = "C:\ProgramData\RasoiOS\PrintAgent"

          # An existing installation of the older Node-based agent: its pairing (a placeholder token, never real).
          New-Item -ItemType Directory -Force $legacy | Out-Null
          '{"serverUrl":"https://example.invalid","logLevel":"info"}' | Set-Content "$legacy\config.json" -Encoding utf8
          '{"version":1,"agentId":"7b0e8a4c-1f2d-4c3b-9a8e-5d6f7a8b9c0d","token":"rsa_ci_placeholder_token_000000000000","serverOrigin":"https://example.invalid","pairedAt":"2026-10-01T00:00:00.000Z"}' | Set-Content "$legacy\credentials.json" -Encoding utf8
          $legacyHash = (Get-FileHash "$legacy\credentials.json").Hash

          function Assert-Running {
            $svc = Get-Service FlowDineOSPrintAgent
            if ($svc.Status -ne "Running") { throw "service is $($svc.Status)" }
            $cim = Get-CimInstance Win32_Service -Filter "Name='FlowDineOSPrintAgent'"
            if (-not $cim.PathName.StartsWith('"')) { throw "service path is not quoted: $($cim.PathName)" }
            if ($cim.StartName -ne "NT SERVICE\FlowDineOSPrintAgent") { throw "service account is $($cim.StartName)" }
            if ($cim.StartMode -ne "Auto") { throw "start mode is $($cim.StartMode)" }
          }

          # Fresh install (silent).
          $p = Start-Process $setup -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "setup exited $($p.ExitCode)" }
          Assert-Running
          if (-not (Test-Path "$install\FlowDineOS.PrintAgent.exe")) { throw "binary not installed" }
          if ((Get-FileHash "$data\credentials.json").Hash -ne $legacyHash) { throw "the RasoiOS pairing was not carried over" }
          if ((Get-FileHash "$legacy\credentials.json").Hash -ne $legacyHash) { throw "the RasoiOS folder was modified" }
          $acl = (Get-Acl $data).Access | ForEach-Object { $_.IdentityReference.Value }
          if ($acl -notcontains "NT SERVICE\FlowDineOSPrintAgent") { throw "service account has no access to the data folder" }
          if ($acl -contains "BUILTIN\Users" -or $acl -contains "Everyone") { throw "data folder is readable by ordinary users" }
          Start-Sleep 15
          # No reachable server: the service keeps running and the agent keeps retrying (no crash loop).
          Assert-Running
          if (-not (Test-Path "$data\logs\agent.log")) { throw "no agent log" }
          Get-Content "$data\logs\agent.log" -Tail 20
          if (Select-String -Path "$data\logs\agent.log" -Pattern "rsa_ci_placeholder_token" -Quiet) { throw "the token reached the log" }

          # Upgrade / repair: run setup again; pairing kept, service running.
          $p = Start-Process $setup -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "upgrade exited $($p.ExitCode)" }
          Assert-Running
          if ((Get-FileHash "$data\credentials.json").Hash -ne $legacyHash) { throw "upgrade lost the pairing" }

          # Uninstall keeps the pairing by default.
          $p = Start-Process "$install\Uninstall.exe" -ArgumentList "/S", "_?=$install" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstall exited $($p.ExitCode)" }
          if (Get-Service FlowDineOSPrintAgent -ErrorAction SilentlyContinue) { throw "service still registered" }
          if (Test-Path "$install\FlowDineOS.PrintAgent.exe") { throw "binary still present" }
          if (-not (Test-Path "$data\credentials.json")) { throw "uninstall removed the pairing without /PURGE" }
          Remove-Item "$install\Uninstall.exe" -Force -ErrorAction SilentlyContinue

          # Reinstall, then uninstall with /PURGE: the pairing goes too; the old RasoiOS folder is never touched.
          $p = Start-Process $setup -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "reinstall exited $($p.ExitCode)" }
          Assert-Running
          $p = Start-Process "$install\Uninstall.exe" -ArgumentList "/S", "/PURGE", "_?=$install" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "purge uninstall exited $($p.ExitCode)" }
          if (Test-Path $data) { throw "/PURGE left the data folder" }
          if ((Get-FileHash "$legacy\credentials.json").Hash -ne $legacyHash) { throw "the RasoiOS folder was modified" }
          "install / upgrade / uninstall / purge all verified"
      - uses: actions/upload-artifact@v4
        with:
          name: flowdineos-print-agent-windows
          path: |
            print-agent/dist/windows/FlowDineOS-Print-Agent-Setup.exe
            print-agent/dist/windows/FlowDineOS.PrintAgent.exe
            print-agent/dist/windows/FlowDineOS.PrintAgent.Service.exe
            print-agent/dist/windows/SHA256SUMS
          if-no-files-found: error

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}" }
      # SC-DEP-01: any high or critical advisory fails the build, except one on the reviewed, dated exception list in
      # scripts/check-audit.mjs. `npm audit` exits non-zero whenever it finds anything, so its JSON is kept and judged
      # by the script, which fails closed on missing or errored output.
      - run: npm audit --audit-level=high --json > npm-audit.json || true
      - run: node scripts/check-audit.mjs npm-audit.json
      # Credential-shaped strings in the tree and in every commit; reports file/commit and category only, never the text.
      - run: npm run security:scan
      - run: git log --all -p --no-color --unified=0 --format="@@commit %h" | node scripts/secret-scan.mjs history
