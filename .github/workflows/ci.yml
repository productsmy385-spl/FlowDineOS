# Continuous integration (S1-P01-T006). Every pull request and push to main is gated by these jobs.
# Required repository secrets (Clerk *development* instance only):
#   CLERK_SECRET_KEY, NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
# Branch protection on main should require: lint, typecheck, unit, static, integration, e2e, build, audit.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:unit

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:static

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Major version to be aligned with Railway in S1-P02-T001.
        image: postgres:16
        env:
          POSTGRES_USER: rasoios
          POSTGRES_PASSWORD: rasoios
          POSTGRES_DB: rasoios_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rasoios" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://rasoios:rasoios@localhost:5432/rasoios_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - name: Apply migrations to an empty database
        run: npx prisma migrate deploy
      # S1-P02-T009: the migrated database must match prisma/schema.prisma exactly.
      - name: Migration drift check
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Seed smoke test (runs twice to prove idempotency)
        run: npm run db:seed && npm run db:seed
      # The suite builds its own run-scoped databases from the migrations (tests/integration/setup).
      - run: npm run test:integration

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rasoios
          POSTGRES_PASSWORD: rasoios
          POSTGRES_DB: rasoios_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rasoios" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CI: "true"
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      DATABASE_URL: postgresql://rasoios:rasoios@localhost:5432/rasoios_e2e?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npx prisma generate
      # The app under test needs a migrated, seeded database (public site specs use the seeded tenants).
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=desktop-chromium --project=tablet --project=mobile
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://rasoios:rasoios@localhost:5432/rasoios_build?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      # Security brief 2026-10-07: no server-only value (compared by name, never printed) and no credential pattern in the
      # browser bundle.
      - run: npm run security:bundle

  # S1-P17-T002: the local print agent builds into one runnable file, on both target OSes (Q-010).
  print-agent:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npm run agent:build
      - run: node print-agent/dist/rasoios-print-agent.cjs version
      - run: npx vitest run tests/unit/print-agent tests/static/print-agent.test.ts

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}" }
      # SC-DEP-01: any high or critical advisory fails the build, except one on the reviewed, dated exception list in
      # scripts/check-audit.mjs. `npm audit` exits non-zero whenever it finds anything, so its JSON is kept and judged
      # by the script, which fails closed on missing or errored output.
      - run: npm audit --audit-level=high --json > npm-audit.json || true
      - run: node scripts/check-audit.mjs npm-audit.json
      # Credential-shaped strings in the tree and in every commit; reports file/commit and category only, never the text.
      - run: npm run security:scan
      - run: git log --all -p --no-color --unified=0 --format="@@commit %h" | node scripts/secret-scan.mjs history
